name: Web Build & Test (Deploy staging if mainline)

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*.*"
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build_and_test:
    uses: geneowak/common-workflows/.github/workflows/laravel-build-and-test.yml@main

  dependabot:
    name: Auto approve and merge Dependabot Pull Requests
    needs: build_and_test
    runs-on: ubuntu-latest
    if: success() && github.event.pull_request.user.login == 'dependabot[bot]'
    env:
      PR_URL: ${{ github.event.pull_request.html_url}}
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2.2.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN}}"

      - name: Approve PR
        run: gh pr review --approve "$PR_URL"

      - name: Auto-merge Dependabot PRs for semver-minor updates
        id: auto-merge-dependabot-prs-for-semver-minor-updates
        if: ${{steps.metadata.outputs.update-type == 'version-update:semver-minor'}}
        run: gh pr merge --auto --merge "$PR_URL"

      - name: Auto-merge Dependabot PRs for semver-patch updates
        id: auto-merge-dependabot-prs-for-semver-patch-updates
        if: ${{steps.metadata.outputs.update-type == 'version-update:semver-patch'}}
        run: gh pr merge --auto --merge "$PR_URL"

  deploy_staging:
    name: Deploy to testing site
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    needs: build_and_test
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.HOST_IP}}
          port: 22
          username: ${{secrets.HOST_USERNAME}}
          key: ${{secrets.PRIVATE_KEY}}
          script: |
            cd ${{secrets.TESTING_DIR}}
            git reset --hard
            git pull origin main
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            php artisan migrate --force
            php artisan optimize
            php artisan pulse:restart
            sudo service php8.3-fpm reload
            source /usr/local/nvm/nvm.sh
            node -v
            npm -v
            npm ci
            npm run build
