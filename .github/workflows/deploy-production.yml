name: Deploy to production manually

on:
  workflow_dispatch:
    branches:
      - main

jobs:
  build_and_test:
    uses: geneowak/common-workflows/.github/workflows/laravel-build-and-test.yml@main

  deploy_production:
    name: Deploy to production via Coolify
    runs-on: ubuntu-latest
    needs: build_and_test
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify Deployment
        run: |
          curl --fail --silent --show-error -X GET "${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_TOKEN }}"
