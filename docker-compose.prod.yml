# =============================================================================
# Production Docker Compose for Blue-Green Deployment
# =============================================================================
# This file is used by the deployment scripts to run containers on the server.
# It is NOT used for local development - use docker-compose.yml instead.
#
# Usage (by deploy scripts):
#   docker-compose -f docker-compose.prod.yml up -d
#
# Environment variables are passed from the deployment configuration.
# =============================================================================

services:
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    environment:
      # Application
      APP_NAME: "${APP_NAME}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_TIMEZONE: "${APP_TIMEZONE:-UTC}"
      APP_URL: "${APP_URL}"

      # Database (SQLite - file is in mounted volume)
      DB_CONNECTION: "sqlite"

      # Logging
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-error}"

      # Session & Cache
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      CACHE_STORE: "${CACHE_STORE:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"

      # Redis (host-level installation accessed via host.docker.internal)
      REDIS_CLIENT: "phpredis"
      REDIS_HOST: "${REDIS_HOST:-host.docker.internal}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"

      # Filesystem
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"

      # Mail
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-}"

      # Broadcasting (disabled - no Soketi in production)
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"

    volumes:
      # SQLite database (persistent across deployments)
      - ${DATA_PATH}/database:/var/www/html/database:rw
      # Laravel storage (uploads, logs, cache)
      - ${DATA_PATH}/storage:/var/www/html/storage:rw

    extra_hosts:
      # Allow container to access host services (Redis)
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - app-network

networks:
  app-network:
    name: ${NETWORK_NAME}
    external: true
