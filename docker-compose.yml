# =============================================================================
# Docker Compose for Local Development
# =============================================================================
# This is for LOCAL DEVELOPMENT only.
# For production deployment, use: ./deploy/scripts/deploy.sh
#
# Usage:
#   docker compose up -d          # Start services
#   docker compose down           # Stop services
#   docker compose logs -f app    # View app logs
# =============================================================================

services:
  app:
    build:
      context: "."
      dockerfile: Dockerfile
      args:
        WWWGROUP: "${WWWGROUP:-1000}"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      WWWUSER: "${WWWUSER:-1000}"
      XDEBUG_MODE: "off"
      APP_NAME: "${APP_NAME:-FindMissa}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_TIMEZONE: "${APP_TIMEZONE:-UTC}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      DB_CONNECTION: "sqlite"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      CACHE_STORE: "${CACHE_STORE:-redis}"
      REDIS_CLIENT: "phpredis"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      REDIS_PORT: "6379"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-}"
      BROADCAST_CONNECTION: "log"
    volumes:
      # Persist SQLite database
      - findMissa-database:/var/www/html/database:rw
      # Persist storage (uploads, logs)
      - findMissa-storage:/var/www/html/storage:rw
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: "redis:alpine"
    restart: always
    volumes:
      - "findMissa-redis:/data"
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s

volumes:
  findMissa-database:
    driver: local
  findMissa-storage:
    driver: local
  findMissa-redis:
    driver: local
